# Деплой статики на Beget по FTP после push в main.
# Секреты: BEGET_FTP_HOST, BEGET_FTP_USER, BEGET_FTP_PASSWORD, optional BEGET_FTP_DIR
name: Deploy to Beget FTP

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check FTP secrets
        id: check
        env:
          HOST: ${{ secrets.BEGET_FTP_HOST }}
          USER: ${{ secrets.BEGET_FTP_USER }}
          PASS: ${{ secrets.BEGET_FTP_PASSWORD }}
        run: |
          if [ -z "$HOST" ] || [ -z "$USER" ] || [ -z "$PASS" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Beget FTP secrets not set — skip upload. Add BEGET_FTP_HOST/USER/PASSWORD (optional BEGET_FTP_DIR)."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.check.outputs.configured == 'true'
      - name: Upload site to Beget
        if: steps.check.outputs.configured == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.BEGET_FTP_HOST }}
          username: ${{ secrets.BEGET_FTP_USER }}
          password: ${{ secrets.BEGET_FTP_PASSWORD }}
          local-dir: ./
          server-dir: ${{ secrets.BEGET_FTP_DIR }}
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/admin/**
            **/.github/**
            **/docs/**
            **/AGENTS.md
            **/PLAN.md
            **/package*.json
            **/scripts/**
