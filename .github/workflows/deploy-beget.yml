# Деплой статики на Beget по FTP после push в main.
# Секреты репозитория: BEGET_FTP_HOST, BEGET_FTP_USER, BEGET_FTP_PASSWORD
# (хост вида ftp.beget.com или IP; корень сайта — обычно public_html или granit-karel.ru/public_html)
name: Deploy to Beget FTP

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require FTP secrets
        env:
          HOST: ${{ secrets.BEGET_FTP_HOST }}
          USER: ${{ secrets.BEGET_FTP_USER }}
          PASS: ${{ secrets.BEGET_FTP_PASSWORD }}
        run: |
          if [ -z "$HOST" ] || [ -z "$USER" ] || [ -z "$PASS" ]; then
            echo "Add BEGET_FTP_HOST, BEGET_FTP_USER, BEGET_FTP_PASSWORD (and optional BEGET_FTP_DIR) in repo secrets."
            exit 1
          fi
      - name: Upload site to Beget
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.BEGET_FTP_HOST }}
          username: ${{ secrets.BEGET_FTP_USER }}
          password: ${{ secrets.BEGET_FTP_PASSWORD }}
          local-dir: ./
          server-dir: ${{ secrets.BEGET_FTP_DIR }}
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/admin/**
            **/.github/**
            **/docs/**
            **/AGENTS.md
            **/PLAN.md
            **/package*.json
            **/scripts/**
