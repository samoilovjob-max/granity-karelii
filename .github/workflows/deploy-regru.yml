# Деплой на VPS Рег.ру по SSH (git pull в /var/www/granity-karelii).
# Секреты: REGRU_FTP_HOST (IP), REGRU_FTP_USER (root), REGRU_FTP_PASSWORD
# Имена сохранены для совместимости с уже заданными secrets.
name: Deploy to Reg.ru FTP

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Require SSH secrets
        env:
          HOST: ${{ secrets.REGRU_FTP_HOST }}
          USER: ${{ secrets.REGRU_FTP_USER }}
          PASS: ${{ secrets.REGRU_FTP_PASSWORD }}
        run: |
          if [ -z "$HOST" ] || [ -z "$USER" ] || [ -z "$PASS" ]; then
            echo "Add REGRU_FTP_HOST, REGRU_FTP_USER, REGRU_FTP_PASSWORD in repo secrets."
            exit 1
          fi

      - name: Pull main on VPS and restart app
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.REGRU_FTP_HOST }}
          username: ${{ secrets.REGRU_FTP_USER }}
          password: ${{ secrets.REGRU_FTP_PASSWORD }}
          script_stop: true
          script: |
            set -e
            git config --global --add safe.directory /var/www/granity-karelii || true
            cd /var/www/granity-karelii
            git fetch origin main
            git reset --hard origin/main
            if command -v pm2 >/dev/null 2>&1; then
              pm2 restart granity-admin || pm2 restart all || true
            fi
            grep -q 113704179 index.html || echo "WARN: metrika id not found in index.html"
            echo "Deployed $(git rev-parse --short HEAD)"
